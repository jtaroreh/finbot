name: Daily scan

on:
  schedule:
    # Weekdays after US cash close (16:00 ET). 21:30 UTC is 17:30 EDT / 16:30 EST.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run finbot scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINBOT_GROK_WEBHOOK_URL: ${{ secrets.FINBOT_GROK_WEBHOOK_URL }}
          FINBOT_GROK_WEBHOOK_SECRET: ${{ secrets.FINBOT_GROK_WEBHOOK_SECRET }}
        run: python -m finbot.cli
