name: Daily scan

on:
  schedule:
    # Weekdays 21:15 UTC (post-market close year-round: 5:15pm EDT in summer, 4:15pm EST in winter).
    - cron: "15 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run finbot scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Per-ticker webhook secrets only (no unsuffixed fallback). A missing
          # pair skips that ticker's webhook with a warning; the run still passes.
          FINBOT_GROK_WEBHOOK_URL_IBM: ${{ secrets.FINBOT_GROK_WEBHOOK_URL_IBM }}
          FINBOT_GROK_WEBHOOK_SECRET_IBM: ${{ secrets.FINBOT_GROK_WEBHOOK_SECRET_IBM }}
          FINBOT_GROK_WEBHOOK_URL_QTUM: ${{ secrets.FINBOT_GROK_WEBHOOK_URL_QTUM }}
          FINBOT_GROK_WEBHOOK_SECRET_QTUM: ${{ secrets.FINBOT_GROK_WEBHOOK_SECRET_QTUM }}
          FINBOT_GROK_WEBHOOK_URL_AIPO: ${{ secrets.FINBOT_GROK_WEBHOOK_URL_AIPO }}
          FINBOT_GROK_WEBHOOK_SECRET_AIPO: ${{ secrets.FINBOT_GROK_WEBHOOK_SECRET_AIPO }}
          FINBOT_GROK_WEBHOOK_URL_SPCX: ${{ secrets.FINBOT_GROK_WEBHOOK_URL_SPCX }}
          FINBOT_GROK_WEBHOOK_SECRET_SPCX: ${{ secrets.FINBOT_GROK_WEBHOOK_SECRET_SPCX }}
        run: python -m finbot.cli
