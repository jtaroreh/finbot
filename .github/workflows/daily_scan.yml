name: Daily scan

on:
  schedule:
    # Weekdays 12:20pm America/Los_Angeles (PDT = 19:20 UTC; note GitHub cron is UTC-only so this is 11:20am PST in winter).
    - cron: "20 19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run finbot scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINBOT_GROK_WEBHOOK_URL: ${{ secrets.FINBOT_GROK_WEBHOOK_URL }}
          FINBOT_GROK_WEBHOOK_SECRET: ${{ secrets.FINBOT_GROK_WEBHOOK_SECRET }}
        run: python -m finbot.cli
